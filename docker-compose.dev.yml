services:
  postgres:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: nexstream
      POSTGRES_USER: nexstream
      POSTGRES_PASSWORD: nexstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexstream -d nexstream"]
      interval: 5s
      timeout: 5s
      retries: 20

  deps:
    image: node:22.16.0-alpine3.21
    working_dir: /app
    command: >
      sh -c "
      corepack enable &&
      pnpm install --store-dir=/pnpm/store &&
      pnpm db:generate
      "
    volumes:
      - .:/app
      - pnpm_store:/pnpm/store
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules

  api:
    image: node:22.16.0-alpine3.21
    working_dir: /app
    command: >
      sh -c "
      corepack enable &&
      pnpm --filter @nexstream/api dev
      "
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexstream:nexstream@postgres:5432/nexstream?schema=public
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - pnpm_store:/pnpm/store
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    image: node:22.16.0-alpine3.21
    working_dir: /app
    command: >
      sh -c "
      corepack enable &&
      pnpm --filter @nexstream/web dev
      "
    environment:
      API_INTERNAL_URL: http://api:4000/api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - pnpm_store:/pnpm/store
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  postgres_dev:
  pnpm_store:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules: